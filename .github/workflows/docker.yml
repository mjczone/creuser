name: Docker

# Builds and publishes both image variants (fat + slim) per
# docs/docker-variants.md. Triggers:
#   - push to main         → publish :edge / :edge-slim (ghcr only)
#   - push of a vN.M.P tag → publish :N.M.P / :N.M.P-slim, plus rolling
#                             :N.M / :N.M-slim, plus :latest / :slim
#                             (ghcr + Docker Hub if DOCKERHUB_* secrets set)
#
# The build runs once per variant via matrix; each variant ships in one
# image manifest (linux/amd64 in v0.1; arm64 added when there's demand).

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/mjczone/creuser
  # Opt the JS-based GitHub Actions (checkout, docker/*) onto Node 24
  # ahead of the June 2026 default flip. The action versions we use
  # (checkout@v4, docker/*@v3+v5+v6) still ship a Node 20 entry point;
  # this runner-level switch forces them onto Node 24 without bumping
  # the action versions independently.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Build + push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [fat, slim]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v') && env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag rules per docs/docker-variants.md:
      #   fat:  vN.M.P → :N.M.P, :N.M, :latest
      #         main   → :edge
      #   slim: vN.M.P → :N.M.P-slim, :N.M-slim, :slim
      #         main   → :edge-slim
      #
      # docker/metadata-action's flavor + tags rules express this
      # declaratively. The version-rolling :N.M tag is added explicitly via
      # the regex pattern that strips the patch component.
      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Docker Hub is gated to tag-only pushes (matches the `if` on
          # the Docker Hub login step above). Without `enable=`, the
          # metadata action lists docker.io regardless and `build-push-action`
          # tries to push there on every run — which 401s with "insufficient
          # scopes" because no Docker Hub login happened on a main-branch
          # push, so the daemon falls back to the anonymous token (pull-only
          # scope). `enable=` keeps Docker Hub off the manifest entirely on
          # non-tag pushes, so build-push-action only targets ghcr.io.
          images: |
            ${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          flavor: |
            latest=false
            suffix=${{ matrix.variant == 'slim' && '-slim' || '' }},onlatest=true
          tags: |
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Creuser
            org.opencontainers.image.description=Creuser ${{ matrix.variant }} variant — see docs/docker-variants.md
            org.opencontainers.image.licenses=LGPL-3.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=MJCZone

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: |
            VARIANT=${{ matrix.variant }}
          # ghcr.io always; Docker Hub only on tag pushes (gated upstream
          # in the metadata action's `images:` list via `enable=` so the
          # Docker Hub manifest entry doesn't even exist on branch pushes).
          # The Docker Hub login step a few above shares the same gate.
          # Push behavior is set via the `outputs:` directive below
          # (which replaces `push: true` — same effect, but lets us also
          # specify zstd compression in one place).
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 only in v0.1. arm64 added when there's demand —
          # cross-compile via QEMU adds ~2x to build time.
          platforms: linux/amd64
          provenance: false
          # zstd compresses + decompresses faster than gzip and produces
          # smaller layers, which translates to a noticeably shorter
          # "exporting to image" / "pushing layers" phase. Modern OCI
          # tooling (containerd, podman, recent Docker) handles zstd
          # transparently; older Docker daemons (≤ 23.0) might fall back
          # to slower decompression — fine for a v0.1 with no legacy
          # registries to support.
          outputs: type=image,push=true,compression=zstd,compression-level=3,force-compression=true
          # Registry-backed cache instead of `type=gha`. GHA's cache has
          # a 10 GB quota shared across the whole repo; Docker layer
          # caches get evicted aggressively whenever the SPA test cache
          # or any other workflow cache pushes them out, so cache hits
          # were inconsistent. `type=registry` lives next to the image
          # in ghcr and has no shared quota — far higher hit rate, esp.
          # on the slow `dotnet restore` + npm install + .NET build
          # layers that dominate a Docker run.
          #
          # `mode=min` (only export layers reachable from the final
          # image) keeps the slim job from redundantly building the
          # `runtime-fat` apt step — see the variant table for which
          # stages each variant actually needs.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant }},mode=min,image-manifest=true,oci-mediatypes=true
