# Production-shape compose. Postgres and Redis are reachable ONLY via the
# internal compose network (no host port mapping); the only thing exposed
# to the outside world is the Creuser web app on $CREUSER_PORT (default 8080).
#
# Required environment variables (e.g. via a .env file alongside this one):
#   POSTGRES_PASSWORD   Strong password for the Postgres "creuser" user.
#
# Optional:
#   CREUSER_PORT        Host port for Creuser. Default 8080.
#   CREUSER_TAG         Image tag. Default "latest" (fat). Use "slim" for the
#                       slim variant. See docs/docker-variants.md.
#
# Connection strings are injected as environment variables; Creuser.Web's
# appsettings.json has empty ConnectionStrings entries so these env vars
# (ConnectionStrings__Postgres / ConnectionStrings__Redis) take precedence
# via ASP.NET Core's standard configuration provider order.

name: creuser

services:
  creuser:
    image: ghcr.io/mjczone/creuser:${CREUSER_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VARIANT: fat
    restart: unless-stopped
    ports:
      - "${CREUSER_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # PORT defaults to 8080 in the image; override via .env if needed.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=creuser;Username=creuser;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
    # Map `host.docker.internal` to the host machine so the in-container app
    # can reach services running on the operator's host — Ollama at
    # localhost:11434, LM Studio at localhost:1234, an SMTP relay, etc. Docker
    # Desktop on Mac/Windows wires this automatically; Linux needs the
    # explicit `host-gateway` form below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - creuser-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: creuser
      POSTGRES_USER: creuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creuser -d creuser"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No `ports:` — internal network only.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    # No `ports:` — internal network only.

volumes:
  creuser-data:
  postgres-data:
  redis-data:
